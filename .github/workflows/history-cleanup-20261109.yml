name: Approved history cleanup 20261109
on:
  push:
    branches: [security/history-cleanup-20261109]
permissions:
  contents: write
concurrency:
  group: approved-history-cleanup-20261109
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install history filtering tool
        run: python -m pip install git-filter-repo==2.47.0
      - name: Rewrite approved paths and verify production trees
        env:
          GH_TOKEN: ${{ github.token }}
          CLEANUP_PLAN: '{"repository":"twinthos/ai-sec-sentinel","refs":{"refs/heads/ci/security-dependency-static-scan-20261103":"a4b15a33bdbe2d22986a402fcffc6781d030ade6","refs/heads/dependabot/github_actions/actions/checkout-7":"aa1cd17f1640b5621911ed7398f49629288e9fd5","refs/heads/dependabot/github_actions/actions/setup-python-7":"fc5571e88f82c85543ed6fa5d39705206745af64","refs/heads/dependabot/github_actions/actions/upload-artifact-7":"118222bc28ce8ddad0feb9e901b8207867cf3b36","refs/heads/dependabot/pip/certifi-gte-2026.10.23":"9b255085f9771842380ab4bb60b4134bdb7a5cf0","refs/heads/dependabot/pip/idna-gte-3.20":"fb8d2986e09c63e0261f51e559c630847af157d5","refs/heads/feat/task-context-firewall-20261103":"5bb8913877cc1debd92e6d6a38aef9c4a4a9c4f7","refs/heads/feat/verified-offline-quickstart-20261103":"b9a42d65067029b6ba67670fc4094f0974462f32","refs/heads/feature/github-agentic-ops-2026-11-04":"d2c074d215cb2752da29185e06aff64c3dbd2c8e","refs/heads/feature/guarded-agentic-workflows-2026-11-04":"022b5b15bc2394f75b268447b1793b79d67fdfea","refs/heads/fix/alert-safety-osv":"aa2e7087f8a44302f2c61093087ff05aff0feec8","refs/heads/fix/mcp-control-path-symlink-check-20261105":"0cee325bbe30ec86eca055b45fdac0a67a3f2ad3","refs/heads/fix/news-coverage-20261108":"f4cf66495d22fddb7e205a739fa89ef219e55bd3","refs/heads/fix/retries-and-shutdown-20261108":"23e3fb889eed62b6cf971d637b900a96186a5ddc","refs/heads/fix/sentinel-hardening-2026-11-01":"338e31c5c1eab3679d7fd3252e09c0e87677886a","refs/heads/fix/source-coverage-and-live-acceptance-20261108":"526a77a4f0d523464b23402edd2e4352e5b11b85","refs/heads/guardian-timeline-platform-20261105":"bc458c33b875a60d4ac655ae3a675d4df01cc38d","refs/heads/hardening/verification-followup-2026-11-01":"2895a0ca378d426a6fa545187be139208ab2b052","refs/heads/hardening/verified-core-2026-11-01":"6d0b1b1f7d0f4f5d9cfc71e848d2773e63056412","refs/heads/master":"7519e1eed335555c948aacb2dcb447ce7e7e8ac5","refs/heads/research/reflection-beam-eval-design-2026-11-03":"7ced2eff490c49dae63825b2d7a6631b78c9d429","refs/heads/security/accurate-threat-awareness-20261108":"45144a500d0e65b58707b881d8edaddc3e5a114f","refs/heads/security/approval-policy-hardening-20261108":"b5cd81819f771ca9e21204e7f2193e08f051b576","refs/heads/security/destination-policy-hardening-20261103":"45214230b5c442c0ef90f9fafc0074f139e02ef9","refs/heads/security/nov-2026-alert-hardening":"abae71433338167e689183293b5131747ea2feb7","refs/heads/security/sentinel-hardening":"a63cafd0e48a1ec74080293b13a6e6dc00a8681e","refs/heads/security/sentinel-outbound-privacy-20261103":"532a84170bce871c46a8315ad540e021521b3c19","refs/heads/sentinel-simple-private-quickstart":"f9eabe402613373fef966cc9da452771c7152076","refs/tags/v1.0.0":"4b49d550b59b37e3f4c1dabf8d540c557eeb528d"},"job_branch":"security/history-cleanup-20261109","default_branch":"master","paths":["guardian_ledger.jsonl","guardian_logs/","sentinel_alerts.db","sentinel_feedback.json","sentinel_state.json","__main__.feedback","__pycache__/"]}'
        shell: python
        run: |
          import base64, json, os, pathlib, subprocess, tempfile
          cfg = json.loads(os.environ["CLEANUP_PLAN"])
          repo = os.environ["GITHUB_REPOSITORY"]
          assert repo == cfg["repository"], "Unexpected repository"
          url = "https://github.com/" + repo + ".git"
          env = os.environ.copy()
          token = env.pop("GH_TOKEN")
          env["GIT_TERMINAL_PROMPT"] = "0"
          env["GIT_CONFIG_COUNT"] = "1"
          env["GIT_CONFIG_KEY_0"] = "http.https://github.com/.extraheader"
          env["GIT_CONFIG_VALUE_0"] = "AUTHORIZATION: basic " + base64.b64encode(("x-access-token:" + token).encode()).decode()
          del token
          
          def git(*args, cwd=None, capture=True):
              return subprocess.check_output(["git", *args], cwd=cwd, env=env, text=True).strip() if capture else subprocess.run(["git", *args], cwd=cwd, env=env, check=True)
          
          def remote_refs():
              lines = git("ls-remote", "--refs", url, "refs/heads/*", "refs/tags/*").splitlines()
              return {line.split()[1]: line.split()[0] for line in lines}
          
          expected = cfg["refs"].copy()
          expected["refs/heads/" + cfg["job_branch"]] = os.environ["GITHUB_SHA"]
          assert remote_refs() == expected, "Remote refs changed; refresh the plan before retrying"
          with tempfile.TemporaryDirectory() as tmp:
              root = pathlib.Path(tmp)
              clone = root / "repository.git"
              git("clone", "--mirror", url, str(clone), capture=False)
              before = {line.split()[0]: line.split()[1] for line in git("for-each-ref", "--format=%(refname) %(objectname)", "refs/heads", "refs/tags", cwd=clone).splitlines()}
              assert before == expected, "Refs moved during clone"
              default = "refs/heads/" + cfg["default_branch"]
              tree_before = git("rev-parse", default + "^{tree}", cwd=clone)
              removal = cfg["paths"] + [".github/workflows/history-cleanup-20261109.yml"]
              pathfile = root / "remove-paths.txt"
              pathfile.write_text("\n".join(removal) + "\n")
              subprocess.run(["git-filter-repo", "--force", "--invert-paths", "--paths-from-file", str(pathfile)], cwd=clone, env=env, check=True)
              after = {line.split()[0]: line.split()[1] for line in git("for-each-ref", "--format=%(refname) %(objectname)", "refs/heads", "refs/tags", cwd=clone).splitlines()}
              assert before.keys() == after.keys(), "Ref names changed"
              assert git("rev-parse", default + "^{tree}", cwd=clone) == tree_before, "Current production files changed"
              all_paths = [line.partition(" ")[2] for line in git("rev-list", "--objects", "--all", cwd=clone).splitlines()]
              assert not any(p == rule or (rule.endswith("/") and p.startswith(rule)) for p in all_paths for rule in removal), "A removed path remains reachable"
              git("fsck", "--no-reflogs", cwd=clone, capture=False)
              assert remote_refs() == before, "Remote changed during rewrite; no update attempted"
              changed = {ref: sha for ref, sha in after.items() if sha != before[ref]}
              assert changed, "No refs changed"
              print("Verified clean history:", len(changed), "refs; production tree preserved", flush=True)
              # One atomic push: either all refs are accepted, or none change.
              # Exact leases reject concurrent updates. Branch protections remain enabled.
              leases = ["--force-with-lease=" + ref + ":" + before[ref] for ref in changed]
              updates = [sha + ":" + ref for ref, sha in changed.items()]
              git("push", "--atomic", *leases, url, *updates, cwd=clone, capture=False)
              assert remote_refs() == after, "Post-push refs did not match; investigate"
              print("SUCCESS: all planned branch and tag histories updated; production tree unchanged", flush=True)
              print("LIMIT: GitHub pull-request refs, cached commit views, workflow refs and external clones are not purged", flush=True)
          

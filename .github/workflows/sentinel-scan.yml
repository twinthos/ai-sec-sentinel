name: Sentinel CI Preview (no alerts)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  sentinel-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Preview feed scan without sending alerts or changing state
        run: python3 ai_sec_sentinel.py --dry-run --since-hours 24 --feed-limit 100
      - name: Run tests
        run: python3 -m unittest tests.test_sentinel_core -v

name: Guardian platform tests
on:
  pull_request:
    paths:
      - 'guardian_*.py'
      - 'requirements-guardian.txt'
      - 'tests/test_guardian_*.py'
      - '.github/workflows/guardian-platform.yml'
  push:
    branches: [master]
    paths:
      - 'guardian_*.py'
      - 'requirements-guardian.txt'
      - 'tests/test_guardian_*.py'
      - '.github/workflows/guardian-platform.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-guardian.txt
      - run: python -m unittest discover -s tests -p 'test_guardian_*.py' -v
      - run: python -m compileall -q guardian_platform.py guardian_sources.py guardian_mcp.py guardian_stack.py guardian_delivery.py guardian_backfill.py guardian_website.py
      - run: docker build -f Dockerfile.guardian -t sentinel-guardian:test .

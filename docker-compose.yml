services:
  sentinel:
    build: .
    image: twinthos/ai-sec-sentinel:local
    restart: unless-stopped
    init: true
    volumes:
      - sentinel-data:/data
    environment:
      SENTINEL_DATA_DIR: /data
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SENTINEL_WEBHOOK_URL: ${SENTINEL_WEBHOOK_URL:-}
      SENTINEL_WEBHOOK_PLATFORM: ${SENTINEL_WEBHOOK_PLATFORM:-slack}
    healthcheck:
      test: ["CMD", "python3", "/app/ai_sec_sentinel.py", "--health"]
      interval: 5m
      timeout: 15s
      retries: 3
      start_period: 5m

volumes:
  sentinel-data:

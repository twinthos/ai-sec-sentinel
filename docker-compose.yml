version: "3.9"

services:
  sentinel:
    build: .
    image: twinthos/ai-sec-sentinel:latest
    container_name: ai-sec-sentinel
    restart: unless-stopped
    volumes:
      - ./data:/data
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - SENTINEL_DATA_DIR=/data
    command: ["--daemon", "--interval", "60"]
    healthcheck:
      test: ["CMD", "python3", "/app/ai_sec_sentinel.py", "--health"]
      interval: 5m
      timeout: 15s
      retries: 3
      start_period: 5m

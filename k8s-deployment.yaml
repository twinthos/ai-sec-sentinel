# Example only: replace the image with a built, tested SHA256-pinned digest.
# This workload runs ONLY the Sentinel threat-intelligence daemon.
# Guardian Gate and the optional dashboard are separate processes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: twinthos-sentinel
  labels:
    app: twinthos-sentinel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: twinthos-sentinel
  template:
    metadata:
      labels:
        app: twinthos-sentinel
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sentinel
          image: REPLACE_WITH_TESTED_IMAGE_AT_SHA256_DIGEST
          imagePullPolicy: IfNotPresent
          command: ["python3", "/app/ai_sec_sentinel.py"]
          args: ["--daemon", "--interval", "60"]
          env:
            - name: SENTINEL_DATA_DIR
              value: /data
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sentinel-secrets
                  key: telegram-bot-token
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: sentinel-secrets
                  key: telegram-chat-id
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: sentinel-data
              mountPath: /data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          startupProbe:
            exec:
              command: ["python3", "/app/ai_sec_sentinel.py", "--health"]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["python3", "/app/ai_sec_sentinel.py", "--health"]
            periodSeconds: 300
            timeoutSeconds: 15
          readinessProbe:
            exec:
              command: ["python3", "/app/ai_sec_sentinel.py", "--health"]
            periodSeconds: 60
            timeoutSeconds: 15
      volumes:
        - name: sentinel-data
          persistentVolumeClaim:
            claimName: sentinel-data-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sentinel-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

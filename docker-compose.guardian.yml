services:
  guardian-api:
    build:
      context: .
      dockerfile: Dockerfile.guardian
    restart: unless-stopped
    init: true
    environment:
      SENTINEL_GUARDIAN_DB: /data/guardian_platform.sqlite3
      SENTINEL_PLATFORM_API_KEY: ${SENTINEL_PLATFORM_API_KEY:?Set a long random API key}
      NVD_API_KEY: ${NVD_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SENTINEL_SMTP_HOST: ${SENTINEL_SMTP_HOST:-}
      SENTINEL_SMTP_PORT: ${SENTINEL_SMTP_PORT:-587}
      SENTINEL_SMTP_FROM: ${SENTINEL_SMTP_FROM:-}
      SENTINEL_SMTP_USER: ${SENTINEL_SMTP_USER:-}
      SENTINEL_SMTP_PASSWORD: ${SENTINEL_SMTP_PASSWORD:-}
      SENTINEL_SLACK_WEBHOOK_URL: ${SENTINEL_SLACK_WEBHOOK_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    ports:
      - "127.0.0.1:8099:8099"
    volumes:
      - guardian-data:/data
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/health',timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
  guardian-ingest:
    build:
      context: .
      dockerfile: Dockerfile.guardian
    restart: unless-stopped
    init: true
    command: ["python","guardian_sources.py","--interval","60"]
    environment:
      SENTINEL_GUARDIAN_DB: /data/guardian_platform.sqlite3
      NVD_API_KEY: ${NVD_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SENTINEL_SMTP_HOST: ${SENTINEL_SMTP_HOST:-}
      SENTINEL_SMTP_PORT: ${SENTINEL_SMTP_PORT:-587}
      SENTINEL_SMTP_FROM: ${SENTINEL_SMTP_FROM:-}
      SENTINEL_SMTP_USER: ${SENTINEL_SMTP_USER:-}
      SENTINEL_SMTP_PASSWORD: ${SENTINEL_SMTP_PASSWORD:-}
      SENTINEL_SLACK_WEBHOOK_URL: ${SENTINEL_SLACK_WEBHOOK_URL:-}
    volumes:
      - guardian-data:/data
    depends_on:
      guardian-api:
        condition: service_healthy
volumes:
  guardian-data:
